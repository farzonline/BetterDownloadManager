<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BDM options</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 560px; margin: 24px auto; padding: 0 16px; font: 14px system-ui, sans-serif; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; }
  input[type=text], input[type=number], textarea { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
  .row { margin: 10px 0; }
  button { font: inherit; padding: 6px 14px; }
</style>
</head>
<body>
<h1>Better Download Manager</h1>
<div class="row"><label><input type="checkbox" id="enabled"> Take over browser downloads</label></div>
<div class="row"><label><input type="checkbox" id="floatingButton"> Show “Download this video” button over playing video</label></div>
<label for="minSize">Only take over files larger than (KB; unknown sizes are always taken)</label>
<input type="number" id="minSize" min="0">
<label for="types">File types to take over (space separated)</label>
<textarea id="types" rows="4"></textarea>
<label for="excluded">Never take over from these sites (one per line)</label>
<textarea id="excluded" rows="3"></textarea>
<p><button id="save">Save</button> <span id="status"></span></p>
<p>Tip: hold <b>Alt</b> while clicking a link to let the browser download it instead.</p>
<script src="options.js" type="module"></script>
</body>
</html>
