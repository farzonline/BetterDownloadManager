<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Better Download Manager</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #6b7280; --line: #e5e7eb; --accent: #16a34a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #ececec; --muted: #9ca3af; --line: #2a2a2a; } }
  body { margin: 0; width: 380px; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
  header { padding: 10px 12px; font-weight: 600; border-bottom: 1px solid var(--line); }
  #empty { padding: 18px 12px; color: var(--muted); }
  .item { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 8px; background: var(--line); margin-right: 6px; }
  button { font: inherit; padding: 3px 9px; margin-right: 6px; border: 1px solid var(--line); border-radius: 5px; background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .status { color: var(--muted); font-size: 12px; margin-left: 2px; }
  footer { padding: 8px 12px; }
</style>
</head>
<body>
<header>Better Download Manager</header>
<div id="empty">No media found on this page yet. Play the video, then reopen this popup.</div>
<div id="list"></div>
<footer id="deep"></footer>
<script src="popup.js" type="module"></script>
</body>
</html>
